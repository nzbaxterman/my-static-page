<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baxter Family Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #14472c;
      --green-mid:    #1a5c38;
      --green-accent: #2e8b57;
      --green-light:  #e1f5ee;
      --green-muted:  #9fe1cb;
      --text-primary: #1a1a1a;
      --text-secondary: #5a6672;
      --text-muted:   #8a9299;
      --bg-page:      #f2f5f3;
      --bg-card:      #ffffff;
      --border:       rgba(0,0,0,0.08);
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:    0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --radius-sm:    8px;
      --radius-md:    12px;
      --radius-lg:    16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--green-mid);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e1f5ee;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .topbar-brand svg {
      width: 22px;
      height: 22px;
      stroke: #5dcaa5;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #9fe1cb;
      font-size: 13px;
    }

    .user-pill svg {
      width: 16px;
      height: 16px;
      stroke: #5dcaa5;
    }

    .logout-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #c8edd9;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.18); }

    /* ── Weather strip ── */
    .weather-strip {
      background: var(--green-dark);
      padding: 8px 24px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .weather-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--green-muted);
      font-size: 12.5px;
      font-family: 'DM Mono', monospace;
    }

    .weather-item svg {
      width: 14px;
      height: 14px;
      stroke: #5dcaa5;
      flex-shrink: 0;
    }

    /* ── Main content ── */
    main {
      flex: 1;
      padding: 28px 24px 32px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Service card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: rgba(46,139,87,0.25);
      color: var(--text-primary);
      text-decoration: none;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 24px;
      height: 24px;
    }

    .ic-green  { background: #eaf3de; }
    .ic-green svg { stroke: #3b6d11; }
    .ic-blue   { background: #e6f1fb; }
    .ic-blue svg { stroke: #185fa5; }
    .ic-teal   { background: #e1f5ee; }
    .ic-teal svg { stroke: #0f6e56; }
    .ic-amber  { background: #faeeda; }
    .ic-amber svg { stroke: #854f0b; }
    .ic-purple { background: #eeedfe; }
    .ic-purple svg { stroke: #534ab7; }
    .ic-coral  { background: #faece7; }
    .ic-coral svg { stroke: #993c1d; }
    .ic-gray   { background: #f1efe8; }
    .ic-gray svg { stroke: #5f5e5a; }

    .card-label {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
      color: var(--text-primary);
    }

    /* ── Footer ── */
    footer {
      padding: 14px 24px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .cf-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--green-accent);
    }

    .cf-badge svg {
      width: 13px;
      height: 13px;
      stroke: var(--green-accent);
    }

    @media (max-width: 480px) {
      .topbar { padding: 0 16px; }
      main { padding: 20px 16px 24px; }
      .weather-strip { padding: 8px 16px; gap: 16px; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function logout() {
      window.location.href = "https://portal.nzbaxters.com/cdn-cgi/access/logout?returnTo=https://nzbaxters.cloudflareaccess.com/cdn-cgi/access/logout&nocache=" + new Date().getTime();
      document.cookie.split(";").forEach(function(c) {
        document.cookie = c.trim().split("=")[0] + "=;expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.portal.nzbaxters.com";
      });
      setTimeout(() => {
        window.location.href = "https://portal.nzbaxters.com/cdn-cgi/access/logout?returnTo=https://portal.nzbaxters.com";
      }, 1000);
    }
  </script>

</body>
